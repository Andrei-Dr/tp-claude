name: smoke-ssh

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The local->local tests cover the logic, because Endpoint routes both cases
  # through the same helpers; what they cannot cover is the transport itself --
  # _ssh_cmd, BatchMode, and the login shell that has to find python3 on the
  # far side. This does one real teleport over ssh to localhost.
  loopback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: ssh to localhost with key auth
        run: |
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost 'echo ssh ok; python3 -V'

      - name: seed a project with a session
        run: |
          mkdir -p ~/work/proj ~/elsewhere
          echo "print('hi')" > ~/work/proj/main.py
          enc=$(python3 -c "import re,sys;print(re.sub(r'[^A-Za-z0-9]','-',sys.argv[1]))" "$HOME/work/proj")
          mkdir -p "$HOME/.claude/projects/$enc"
          python3 - <<'PY'
          import json, os, re
          src = os.path.expanduser("~/work/proj")
          enc = re.sub(r"[^A-Za-z0-9]", "-", src)
          d = os.path.expanduser(f"~/.claude/projects/{enc}")
          with open(os.path.join(d, "session.jsonl"), "w") as fh:
              fh.write(json.dumps({"cwd": src, "file": f"{src}/main.py"}) + "\n")
          PY

      - name: teleport over ssh to localhost
        run: ./tp-claude ~/work/proj "$USER@localhost:$HOME/elsewhere/"

      - name: the session arrived and was rewritten
        run: |
          enc=$(python3 -c "import re,sys;print(re.sub(r'[^A-Za-z0-9]','-',sys.argv[1]))" "$HOME/elsewhere/proj")
          f="$HOME/.claude/projects/$enc/session.jsonl"
          test -f "$f" || { echo "session did not arrive at $f"; exit 1; }
          grep -q "$HOME/elsewhere/proj" "$f" || { echo "path was not rewritten"; cat "$f"; exit 1; }
          echo "ok: $(cat "$f")"
